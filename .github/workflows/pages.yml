# Publishes the site to GitHub Pages (https://webevolta-cmd.github.io/tutto-design-studio/).
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Netlify does not use this file; it builds from netlify.toml.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/magical-dijkstra-ef06td, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://webevolta-cmd.github.io/tutto-design-studio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
